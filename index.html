<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Checker · Dunkin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Prompt','Nunito',sans-serif;background:#faf7f3;-webkit-tap-highlight-color:transparent}
  .num{font-family:'Nunito',sans-serif}
  .card{background:#fff;border:1px solid #f0ece6;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  input,button{touch-action:manipulation}
  .stepbtn{width:56px;height:56px;font-size:28px;font-weight:800;border-radius:14px;display:flex;align-items:center;justify-content:center;user-select:none;flex-shrink:0}
  .stepbtn-sm{width:42px;height:42px;font-size:22px;font-weight:800;border-radius:11px;display:flex;align-items:center;justify-content:center;user-select:none;flex-shrink:0}
  .quickbtn{padding:5px 8px;font-size:12.5px;font-weight:700;border-radius:8px;background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;user-select:none;flex-shrink:0}
  .quickbtn:active{background:#e2e8f0}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#e5ded5;border-radius:6px}
</style>
</head>
<body class="min-h-screen">

<!-- ══════════ LOGIN ══════════ -->
<div id="loginView" class="hidden min-h-screen flex items-center justify-center px-4">
  <div class="card w-full max-w-sm p-8">
    <div class="text-center mb-6">
      <div class="text-3xl font-extrabold" style="color:#FF671F">DUNKIN'</div>
      <div class="text-xs font-bold tracking-widest text-gray-400 mt-1">CHECKER · ครัว</div>
    </div>
    <div id="loginErr" class="hidden mb-3 text-sm text-red-600 bg-red-50 rounded-xl px-3 py-2"></div>
    <input id="lgUser" placeholder="Username (เช่น Emp01-K0003)" class="w-full mb-3 px-4 py-3 rounded-xl border border-gray-200 text-lg focus:border-orange-400 outline-none" autocomplete="username">
    <input id="lgPass" type="password" placeholder="Password" class="w-full mb-5 px-4 py-3 rounded-xl border border-gray-200 text-lg focus:border-orange-400 outline-none" autocomplete="current-password">
    <button id="lgBtn" class="w-full py-3.5 rounded-xl font-bold text-white text-lg" style="background:#FF671F">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="appView" class="hidden">
  <header class="bg-white border-b border-gray-100 sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <span class="text-2xl">✅</span>
      <div class="min-w-0">
        <div class="font-extrabold text-lg" style="color:#FF671F">Checker</div>
        <div class="text-xs text-gray-400 truncate" id="userLabel"></div>
      </div>
      <button id="logoutBtn" class="ml-auto px-3 py-2 rounded-xl text-sm font-bold text-gray-600 bg-gray-100">ออก</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-4">
    <!-- ── เลือกใบ ── -->
    <div id="pickView">
      <div class="card p-4 mb-3">
        <div class="text-sm font-bold text-gray-500 mb-2">🔢 เปิดใบด้วยเลขเอกสาร (7 หลัก)</div>
        <div class="flex gap-2">
          <input id="ckCode" inputmode="numeric" placeholder="0138926"
                 class="flex-1 px-4 py-3 rounded-xl border border-gray-200 text-2xl font-extrabold num text-center outline-none focus:border-orange-400">
          <button id="ocrBtn" class="px-4 rounded-xl font-bold text-white text-2xl" style="background:#334155" title="สแกนด้วยกล้อง">📷</button>
          <button id="ckOpenBtn" class="px-6 rounded-xl font-bold text-white text-lg" style="background:#FF671F">เปิด</button>
        </div>
        <div id="ckErr" class="hidden mt-2 text-sm text-red-600 bg-red-50 rounded-xl px-3 py-2"></div>
      </div>

      <div class="flex items-center justify-between mb-2 px-1">
        <div class="text-sm font-bold text-gray-500">📄 ใบวันนี้ — แตะเพื่อเช็ค</div>
        <button id="refreshDocs" class="text-sm font-bold" style="color:#FF671F">🔄 รีเฟรช</button>
      </div>
      <div id="docList" class="space-y-2"></div>
    </div>

    <!-- ── เช็คใบ (workspace) ── -->
    <div id="checkView" class="hidden">
      <div class="card p-4 mb-3" style="background:linear-gradient(90deg,#FFF4EC,#FDECF4)">
        <div class="text-lg font-extrabold" id="cvDoc" style="color:#FF671F"></div>
        <div class="text-sm text-gray-600 mt-1">
          <span id="cvKit"></span> → ร้าน <span id="cvShop" class="font-bold"></span>
          · วันส่ง <span id="cvDate"></span>
        </div>
        <div class="mt-2 flex items-center gap-2">
          <div class="flex-1 h-2 rounded-full bg-white overflow-hidden">
            <div id="cvBar" class="h-full" style="background:#16a34a;width:0%"></div>
          </div>
          <div class="text-xs font-bold text-gray-500"><span id="cvDone">0</span>/<span id="cvTotal">0</span></div>
        </div>
      </div>
      <div id="itemList" class="space-y-2 pb-3"></div>
      <div class="flex gap-2 pb-6">
        <button id="exitBtn" class="flex-1 py-4 rounded-xl font-bold text-gray-600 bg-gray-100 text-lg">ออก (พักไว้)</button>
        <button id="saveBtn" class="flex-1 py-4 rounded-xl font-bold text-white text-lg flex items-center justify-center gap-2" style="background:#16a34a"><span>✓</span> เสร็จ</button>
      </div>
    </div>
  </main>
</div>

<!-- ══════════ OCR MODAL ══════════ -->
<div id="ocrModal" class="hidden fixed inset-0 z-50 bg-black/80 flex flex-col items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-white text-center font-bold mb-2">เล็งกล้องที่ช่อง <span style="color:#FFB27A">Document No.</span></div>
    <div class="relative rounded-2xl overflow-hidden bg-black" style="aspect-ratio:4/3">
      <video id="ocrVideo" class="w-full h-full object-cover" playsinline muted></video>
      <div class="absolute left-4 right-4 top-1/2 -translate-y-1/2 h-16 border-2 border-dashed border-orange-400 rounded-lg"></div>
    </div>
    <div id="ocrStatus" class="text-center text-sm text-gray-200 mt-2 h-5"></div>
    <div class="flex gap-2 mt-3">
      <button id="ocrCancel" class="flex-1 py-3 rounded-xl font-bold text-gray-700 bg-gray-200">ยกเลิก</button>
      <button id="ocrShot" class="flex-1 py-3 rounded-xl font-bold text-white" style="background:#FF671F">📸 ถ่าย & อ่าน</button>
    </div>
  </div>
</div>
<canvas id="ocrCanvas" class="hidden"></canvas>

<script>
// ⚙️ Backend API (Checker :8601)
const API_BASE = 'https://kitchen_checker.mobile1234.site';
const API = API_BASE || location.origin;
const TOKEN_KEY = 'ks_token';
const getTok = ()=>{ try{return localStorage.getItem(TOKEN_KEY)}catch{return null} };
const setTok = (t)=>{ try{ t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY) }catch{} };
const authH  = ()=>{ const t=getTok(); return t?{'Authorization':'Bearer '+t}:{} };
const fmt = (n,d=0)=> (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const $ = (id)=>document.getElementById(id);
let curUser=null, curDoc=null, ocrStream=null;

async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...authH(),...(opts.headers||{})}});
  if(r.status===401){setTok(null);showLogin();throw new Error('unauthorized');}
  if(!r.ok){const e=await r.json().catch(()=>({detail:'error'}));throw new Error(e.detail||('HTTP '+r.status));}
  return r.json();
}
function showLogin(){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');}
function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');}

// ── login ──
async function doLogin(){
  $('loginErr').classList.add('hidden');
  const username=$('lgUser').value.trim(), password=$('lgPass').value;
  if(!username||!password)return;
  $('lgBtn').disabled=true;$('lgBtn').textContent='กำลังเข้า...';
  try{
    const d=await api('/api/login',{method:'POST',body:JSON.stringify({username,password})});
    setTok(d.token);curUser=d.user;showApp();await boot();
  }catch(e){$('loginErr').textContent=e.message;$('loginErr').classList.remove('hidden');}
  finally{$('lgBtn').disabled=false;$('lgBtn').textContent='เข้าสู่ระบบ';}
}

// ── list docs (3 กลุ่ม: 🟠 ยังไม่เช็ค → 🟡 กำลังเช็ค → 🟢 เสร็จ) ──
function docCard(x, badge){
  const now=Date.now();
  const lockedOther = x.locked_by && x.locked_by!==(curUser&&curUser.username)
      && x.locked_at && (now - new Date(x.locked_at).getTime() < 30*60*1000);
  const onclick = lockedOther ? `alert('ใบนี้กำลังถูกเช็คโดย ${x.locked_by}')` : `openDoc('${x.tro_code}')`;
  const lockTag = lockedOther ? ` <span class="text-[11px] font-bold text-red-500">🔒 ${x.locked_by}</span>` : '';
  const cls = lockedOther ? 'opacity-60' : 'active:bg-orange-50';
  const sendDate = x.de_date ? ` · ส่ง ${x.de_date.slice(0,10)}` : '';
  return `<div class="card p-4 flex items-center gap-3 ${cls}" onclick="${onclick}">
      <div class="flex-1 min-w-0">
        <div class="font-extrabold num text-lg" style="color:#FF671F">TO-${x.kitchen} ${String(x.tro_code).padStart(7,'0')}</div>
        <div class="text-sm text-gray-500 truncate">→ ร้าน ${x.shop_name||x.shop||'—'} · ${x.n_item} รายการ · ${fmt(x.total_qty)} ชิ้น${sendDate}${lockTag}</div>
      </div>${badge}
      <div class="text-gray-300 text-xl">›</div>
    </div>`;
}
function docSection(items, emoji, title, color, badgeFn, collapsible, open){
  if(!items.length) return '';
  const cards = items.map(x=>docCard(x, badgeFn(x))).join('');
  const cnt = `<span class="text-xs font-bold" style="color:${color}">${items.length} ใบ</span>`;
  if(collapsible){
    return `<div class="mb-1">
      <button onclick="toggleGrp(this)" class="w-full flex items-center gap-2 px-1 py-2">
        <span>${emoji}</span><span class="text-sm font-bold" style="color:${color}">${title}</span>${cnt}
        <span class="ml-auto text-gray-400 grp-arrow" style="display:inline-block;transition:transform .15s;transform:rotate(${open?90:0}deg)">›</span>
      </button>
      <div class="grp-body space-y-2 ${open?'':'hidden'}">${cards}</div>
    </div>`;
  }
  return `<div class="mb-1">
    <div class="flex items-center gap-2 px-1 py-2">
      <span>${emoji}</span><span class="text-sm font-bold" style="color:${color}">${title}</span>${cnt}
    </div>
    <div class="space-y-2">${cards}</div>
  </div>`;
}
function toggleGrp(btn){
  const body=btn.parentElement.querySelector('.grp-body');
  const arrow=btn.querySelector('.grp-arrow');
  const hidden=body.classList.toggle('hidden');
  if(arrow) arrow.style.transform='rotate('+(hidden?0:90)+'deg)';
}
window.toggleGrp=toggleGrp;

async function loadDocs(){
  const d=await api('/api/docs');
  const box=$('docList');
  if(!d.docs.length){box.innerHTML='<div class="text-center text-gray-400 py-8">ยังไม่มีใบ</div>';return;}
  const now=Date.now();
  const lockValid = x => x.locked_by && x.locked_at && (now - new Date(x.locked_at).getTime() < 30*60*1000);
  const pending=[], doing=[], done=[];
  d.docs.forEach(x=>{
    if(x.status==='done')                    done.push(x);
    else if(lockValid(x) || x.n_checked>0)   doing.push(x);
    else                                      pending.push(x);
  });
  const bPending=x=>`<span class="text-xs font-bold text-orange-700 bg-orange-50 px-2 py-1 rounded-lg">${x.n_checked}/${x.n_item}</span>`;
  const bDoing  =x=>`<span class="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg">${x.n_checked}/${x.n_item}</span>`;
  const bDone   =x=>`<span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded-lg">✓ ${x.n_checked}/${x.n_item}</span>`;
  box.innerHTML =
      docSection(pending,'🟠','ยังไม่เช็ค','#c2410c',bPending,false,true)
    + docSection(doing,  '🟡','กำลังเช็ค', '#b45309',bDoing,  false,true)
    + docSection(done,   '🟢','เช็คครบ',   '#15803d',bDone,   true, false);
}

// ── open doc ──
async function openDoc(code){
  $('ckErr').classList.add('hidden');
  try{
    const d=await api('/api/doc/'+encodeURIComponent(code));
    curDoc=d;
    $('cvDoc').textContent=d.header.document_no;
    $('cvKit').textContent=d.header.kitchen_name||d.header.kitchen;
    $('cvShop').textContent=d.header.shop_name||d.header.shop||'—';
    $('cvDate').textContent=d.header.de_date||'—';
    renderItems();
    $('pickView').classList.add('hidden');$('checkView').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){$('ckErr').textContent=e.message;$('ckErr').classList.remove('hidden');}
}
window.openDoc=openDoc;

// ── render items (mockup-style + quick buttons) ──
function renderItems(){
  const its=curDoc.items;
  const done=its.filter(i=>i.qty_checked!==null).length;
  $('cvDone').textContent=done;$('cvTotal').textContent=its.length;
  $('cvBar').style.width=(its.length?done/its.length*100:0)+'%';
  $('itemList').innerHTML=its.map((it,idx)=>{
    const checked=it.qty_checked!==null;
    const sys=Number(it.qty_system)||0;
    const val=checked?it.qty_checked:sys;
    const diff=checked?(it.qty_checked-sys):0;
    let ring='border-l-4 border-l-slate-300', bg='';
    if(checked && diff===0){ ring='border-l-4 border-l-green-500'; bg='background:#f0fdf4'; }
    else if(checked){ ring='border-l-4 border-l-amber-500'; bg='background:#fffbeb'; }
    // quick buttons ตามขนาด qty_system
    let quicks='';
    if(sys>=12) quicks+=`<button class="quickbtn" onclick="stepQty(${idx},12)">+12</button>`;
    if(sys>=6)  quicks+=`<button class="quickbtn" onclick="stepQty(${idx},6)">+6</button>`;
    quicks+=`<button class="quickbtn" style="background:#FFF0E6;color:#c2410c;border-color:#ffd9bd" onclick="setQty(${idx},${sys})">ครบ</button>`;
    return `<div class="card ${ring} px-3 py-2 flex items-center gap-2" style="${bg}">
      <div class="flex-1 min-w-0">
        <div class="num text-base font-extrabold leading-tight" style="color:#111">${it.code} ${checked?'<span class=\"text-green-600 text-sm\">✓</span>':''}</div>
        <div class="text-xs text-gray-500 truncate">${it.name||'—'} <span class="text-gray-400">· ระบบ ${fmt(sys)}${diff!==0?` <span class="${diff<0?'text-red-600':'text-green-600'} font-bold">${diff>0?'+':''}${diff}</span>`:''}</span></div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0">
        ${quicks}
        <button class="stepbtn-sm bg-red-50 text-red-600 active:bg-red-100" onclick="stepQty(${idx},-1)">−</button>
        <input id="qi${idx}" inputmode="numeric" value="${val}" onchange="saveQty(${idx})"
               class="w-14 h-11 text-center text-xl font-extrabold num rounded-lg border-2 ${checked?'border-green-300 bg-green-50':'border-gray-200'} outline-none focus:border-orange-400">
        <button class="stepbtn-sm text-white active:opacity-80" style="background:#FF671F" onclick="stepQty(${idx},1)">+</button>
      </div>
    </div>`;}).join('');
}

function stepQty(idx,delta){
  const inp=$('qi'+idx);
  inp.value=Math.max(0,(parseInt(inp.value)||0)+delta);
  saveQty(idx);
}
function setQty(idx,val){
  $('qi'+idx).value=Math.max(0,val);
  saveQty(idx);
}
window.stepQty=stepQty; window.setQty=setQty;

async function saveQty(idx){
  const it=curDoc.items[idx];
  const qty=Math.max(0,parseInt($('qi'+idx).value)||0);
  $('qi'+idx).value=qty;
  try{
    await api('/api/check',{method:'POST',body:JSON.stringify({tro_code:curDoc.header.tro_code,seq:it.seq,qty})});
    it.qty_checked=qty; it.checked_by=curUser.username;
    it.checked_at=new Date().toTimeString().slice(0,5);
    renderItems();
  }catch(e){ console.error('save error',e); alert('บันทึกไม่สำเร็จ: '+(e.message||e)); }
}
window.saveQty=saveQty;

async function boot(){
  $('userLabel').textContent=(curUser.full_name||curUser.username)+' · ครัว '+(curUser.kitchen_name||curUser.kitchen||'ทุกครัว');
  await loadDocs();
}

// ── OCR (กล้องอ่านเลขเอกสาร) ──
async function startOCR(){
  $('ocrModal').classList.remove('hidden');
  $('ocrStatus').textContent='';
  try{
    ocrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('ocrVideo'); v.srcObject=ocrStream; await v.play();
  }catch(e){ $('ocrStatus').textContent='เปิดกล้องไม่ได้: '+(e.message||e); }
}
function stopOCR(){
  if(ocrStream){ ocrStream.getTracks().forEach(t=>t.stop()); ocrStream=null; }
  $('ocrModal').classList.add('hidden');
}
async function shotOCR(){
  const v=$('ocrVideo'), c=$('ocrCanvas');
  if(!v.videoWidth){ $('ocrStatus').textContent='กล้องยังไม่พร้อม'; return; }
  // crop เฉพาะแถบกลาง (บริเวณกรอบเล็ง) เพื่อความแม่น
  const cw=v.videoWidth, ch=v.videoHeight;
  const sy=Math.round(ch*0.40), sh=Math.round(ch*0.20);
  c.width=cw; c.height=sh;
  c.getContext('2d').drawImage(v,0,sy,cw,sh,0,0,cw,sh);
  $('ocrShot').disabled=true; $('ocrStatus').textContent='กำลังอ่าน...';
  try{
    const {data:{text}}=await Tesseract.recognize(c,'eng',{
      tessedit_char_whitelist:'0123456789TOK- '
    });
    const m=text.replace(/\s+/g,' ').match(/(\d{7})/);
    if(m){
      $('ckCode').value=m[1];
      $('ocrStatus').textContent='อ่านได้: '+m[1]+' — ตรวจแล้วกด "เปิด"';
      setTimeout(stopOCR,800);
    }else{
      $('ocrStatus').textContent='อ่านเลขไม่เจอ ลองใหม่ (จ่อให้ชัด/ตรงกรอบ)';
    }
  }catch(e){ $('ocrStatus').textContent='อ่านผิดพลาด: '+(e.message||e); }
  finally{ $('ocrShot').disabled=false; }
}

// ── events ──
$('lgBtn').onclick=doLogin;
$('lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('logoutBtn').onclick=()=>{setTok(null);curUser=null;showLogin();};
$('refreshDocs').onclick=()=>loadDocs();
$('saveBtn').onclick=async ()=>{
  const b=$('saveBtn'); b.disabled=true;
  try{ await api('/api/doc/'+encodeURIComponent(curDoc.header.tro_code)+'/done',{method:'POST'}); }
  catch(e){ alert('บันทึกไม่สำเร็จ: '+(e.message||e)); b.disabled=false; return; }
  b.style.background='#15803d'; b.innerHTML='<span>✓</span> เสร็จแล้ว';
  setTimeout(()=>{
    $('checkView').classList.add('hidden'); $('pickView').classList.remove('hidden');
    b.disabled=false; b.style.background='#16a34a'; b.innerHTML='<span>✓</span> เสร็จ';
    loadDocs();
  }, 450);
};
$('exitBtn').onclick=async ()=>{
  try{ await api('/api/doc/'+encodeURIComponent(curDoc.header.tro_code)+'/release',{method:'POST'}); }catch(e){}
  $('checkView').classList.add('hidden'); $('pickView').classList.remove('hidden');
  loadDocs();
};
$('ckOpenBtn').onclick=()=>{const c=$('ckCode').value.trim();if(c)openDoc(c);};
$('ckCode').addEventListener('keydown',e=>{if(e.key==='Enter'){const c=$('ckCode').value.trim();if(c)openDoc(c);}});
$('ocrBtn').onclick=startOCR;
$('ocrCancel').onclick=stopOCR;
$('ocrShot').onclick=shotOCR;

(async function(){
  if(getTok()){try{const m=await api('/api/me');curUser={username:m.username,full_name:m.full_name,role:m.role,kitchen:m.kitchen,kitchen_name:m.kitchen_name};showApp();await boot();return;}catch{}}
  showLogin();
})();
</script>
</body>
</html>
