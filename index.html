<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kitchen · Dunkin</title>
<script>
(function(){ try{
  var v=localStorage.getItem('ks_fontsize');
  if(v) document.documentElement.style.fontSize=v+'px';
}catch(e){} })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Prompt','Nunito',sans-serif;background:#faf7f3;-webkit-tap-highlight-color:transparent}
  .card{background:#fff;border:1px solid #f0ece6;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  input,button,a{touch-action:manipulation}
  .menu-link{display:flex;align-items:center;gap:14px;padding:16px;text-decoration:none;color:inherit}
  .menu-link:active{background:#FFF4EC}
</style>
</head>
<body class="min-h-screen">

<!-- ══════════ LOADING (ตรวจ token เดิม) ══════════ -->
<div id="loadingView" class="min-h-screen flex items-center justify-center text-gray-400 text-sm">กำลังโหลด...</div>

<!-- ══════════ LOGIN ══════════ -->
<div id="loginView" class="hidden min-h-screen flex items-center justify-center px-4">
  <div class="card w-full max-w-sm p-8">
    <div class="text-center mb-6">
      <div class="text-3xl font-extrabold" style="color:#FF671F">DUNKIN'</div>
      <div class="text-xs font-bold tracking-widest text-gray-400 mt-1">KITCHEN · ครัว</div>
    </div>
    <div id="loginErr" class="hidden mb-3 text-sm text-red-600 bg-red-50 rounded-xl px-3 py-2"></div>
    <input id="lgUser" placeholder="Username (เช่น Emp01-K0003)" class="w-full mb-3 px-4 py-3 rounded-xl border border-gray-200 text-lg focus:border-orange-400 outline-none" autocomplete="username">
    <input id="lgPass" type="password" placeholder="Password" class="w-full mb-5 px-4 py-3 rounded-xl border border-gray-200 text-lg focus:border-orange-400 outline-none" autocomplete="current-password">
    <button id="lgBtn" class="w-full py-3.5 rounded-xl font-bold text-white text-lg" style="background:#FF671F">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ══════════ MENU (หลัง login) ══════════ -->
<div id="menuView" class="hidden">
  <header class="bg-white border-b border-gray-100">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="min-w-0">
        <div class="font-extrabold text-lg" style="color:#FF671F">DUNKIN' Kitchen</div>
        <div class="text-xs text-gray-400 truncate" id="userLabel"></div>
      </div>
      <button id="logoutBtn" class="ml-auto flex-shrink-0 px-3 py-2 rounded-xl text-sm font-bold text-gray-600 bg-gray-100">log out</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4 pb-8">
    <div class="text-sm font-bold text-gray-500 mb-2 px-1">เลือกเมนู</div>
    <div id="menuList" class="space-y-2"></div>
  </main>
</div>

<script>
// ⚙️ Backend API (Checker :8601) — token เดียวกับ check.html / waste.html / report.html
const API = 'https://kitchen_checker.mobile1234.site';
const TOKEN_KEY = 'ks_token';

// ── เมนู: เพิ่มหน้าใหม่ได้ที่นี่ ──
const MENU = [
  { href: 'check.html', icon: '✅', title: 'Checker', desc: 'เช็คสินค้าตามใบโอนออกจากครัว' },
];

const $ = (id)=>document.getElementById(id);
const getTok = ()=>{ try{return localStorage.getItem(TOKEN_KEY)}catch{return null} };
const setTok = (t)=>{ try{ t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY) }catch{} };
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path,opts={}){
  const t=getTok();
  const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(t?{'Authorization':'Bearer '+t}:{}),...(opts.headers||{})}});
  if(r.status===401) setTok(null);
  if(!r.ok){ const e=await r.json().catch(()=>({detail:'error'})); throw new Error(e.detail||('HTTP '+r.status)); }
  return r.json();
}

function show(view){
  ['loadingView','loginView','menuView'].forEach(v=>$(v).classList.toggle('hidden', v!==view));
}

function showMenu(user){
  const who=[user.full_name||user.username];
  if(user.kitchen_name||user.kitchen) who.push(user.kitchen_name||user.kitchen);
  if(user.role==='admin') who.push('admin');
  $('userLabel').textContent=who.join(' · ');
  $('menuList').innerHTML=MENU.map(m=>`
    <a class="card menu-link" href="${esc(m.href)}">
      <span class="text-3xl flex-shrink-0">${m.icon}</span>
      <span class="min-w-0 flex-1">
        <span class="block font-extrabold text-lg text-gray-800">${esc(m.title)}</span>
        <span class="block text-sm text-gray-500">${esc(m.desc)}</span>
      </span>
      <span class="text-2xl text-gray-300 flex-shrink-0">›</span>
    </a>`).join('');
  show('menuView');
}

async function doLogin(){
  $('loginErr').classList.add('hidden');
  const username=$('lgUser').value.trim(), password=$('lgPass').value;
  if(!username||!password) return;
  $('lgBtn').disabled=true; $('lgBtn').textContent='กำลังเข้า...';
  try{
    const d=await api('/api/login',{method:'POST',body:JSON.stringify({username,password})});
    setTok(d.token); $('lgPass').value='';
    showMenu(d.user||{username});
  }catch(e){ $('loginErr').textContent=e.message; $('loginErr').classList.remove('hidden'); }
  finally{ $('lgBtn').disabled=false; $('lgBtn').textContent='เข้าสู่ระบบ'; }
}

$('lgBtn').onclick=doLogin;
$('lgPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
$('lgUser').addEventListener('keydown',e=>{ if(e.key==='Enter') $('lgPass').focus(); });
$('logoutBtn').onclick=()=>{ setTok(null); show('loginView'); };

(async function(){
  if(getTok()){
    try{ showMenu(await api('/api/me')); return; }catch(e){}
  }
  show('loginView');
})();
</script>
</body>
</html>
