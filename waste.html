<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รับ Waste · Dunkin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#FF671F; --green:#16a34a; --bg:#faf7f3; --line:#f0ece6;
         --ink:#1f2937; --muted:#9aa3af; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Prompt','Nunito',sans-serif;background:var(--bg);
       color:var(--ink);-webkit-tap-highlight-color:transparent;padding-bottom:74px}
  .num{font-family:'Nunito',sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .hbar{max-width:768px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{font-weight:800;font-size:18px;color:var(--brand)}
  .ulabel{font-size:12px;color:var(--muted)}
  .lo{margin-left:auto;background:#f1f5f9;color:#475569;border:0;border-radius:10px;
      padding:7px 12px;font-weight:700;font-size:13px}
  .wrap{max-width:768px;margin:0 auto;padding:12px 14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;
        box-shadow:0 1px 3px rgba(0,0,0,.05);padding:12px 14px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .muted{color:var(--muted);font-size:13px}
  .big{font-size:24px;font-weight:800;color:var(--brand)}
  input{font-family:inherit;font-size:16px}
  input[type=text],input[type=number],input[type=password]{width:100%;padding:11px 12px;
        border:1px solid #e5e0d8;border-radius:12px;background:#fff}
  input[type=number]{width:88px;text-align:center;font-family:'Nunito',sans-serif;font-weight:700}
  .btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;width:100%;color:#fff}
  .btn.green{background:var(--green)} .btn.orange{background:var(--brand)}
  .btn.sec{background:#f1f5f9;color:#334155}
  .shop{cursor:pointer} .shop:active{background:#fff8f3}
  .badge{background:#FFF0E6;color:#c2410c;border:1px solid #ffd9bd;border-radius:20px;
         padding:3px 11px;font-size:13px;font-weight:800}
  .near{border-color:var(--green);background:#f0fdf4}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
      display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
  nav button{flex:1;background:none;border:0;padding:12px 0;color:var(--muted);font-size:12px;font-weight:700}
  nav button.on{color:var(--brand)}
  .hide{display:none}
  .item{border-bottom:1px solid var(--line);padding:10px 0}
  .item:last-child{border:0}
  #login{max-width:380px;margin:44px auto;padding:0 18px}
  #login input{margin-bottom:11px}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section id="login" class="hide">
  <div style="text-align:center;margin-bottom:16px">
    <div style="font-size:34px">🍩</div>
    <div class="brand" style="font-size:22px">รับ Waste กลับ</div>
    <div class="muted">Dunkin · Kitchen</div>
  </div>
  <input type="text" id="lgUser" placeholder="username">
  <input type="password" id="lgPass" placeholder="password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn orange" onclick="doLogin()">เข้าสู่ระบบ</button>
  <div class="muted" id="lgErr" style="color:#c0392b;margin-top:10px"></div>
</section>

<!-- ===== APP ===== -->
<div id="app" class="hide">
<header><div class="hbar">
  <span style="font-size:22px">🍩</span>
  <div style="min-width:0">
    <div class="brand">รับ Waste</div>
    <div class="ulabel" id="userLabel"></div>
  </div>
  <button class="lo" onclick="logout()">log out</button>
</div></header>

<section id="pgShops" class="wrap">
  <button class="btn sec" style="margin-bottom:10px" onclick="useLocation()">📍 หาร้านใกล้ฉัน</button>
  <input type="text" id="q" placeholder="ค้นหารหัส/ชื่อสาขา…" oninput="renderShops()" style="margin-bottom:10px">
  <div id="shopList"></div>
</section>

<section id="pgRecv" class="wrap hide">
  <button class="btn sec" style="margin-bottom:10px" onclick="show('shops')">← เลือกร้านอื่น</button>
  <div class="card"><div class="row"><b id="recvShop"></b><span class="badge num" id="recvPend"></span></div></div>
  <div class="card">
    <input type="file" id="photoInput" accept="image/*" capture="environment" class="hide">
    <button class="btn orange" onclick="photoInput.click()">📷 ถ่ายรูปโดนัทที่รับ</button>
    <div id="photoWrap" class="hide" style="margin-top:10px">
      <img id="photoPreview" style="width:100%;border-radius:12px;display:block">
      <div class="muted num" id="photoMeta" style="margin-top:6px"></div>
    </div>
  </div>
  <div class="card" id="recvItems"></div>
  <button class="btn green" onclick="submitReceive()">✓ รับของ</button>
</section>

<section id="pgSum" class="wrap hide">
  <div class="card">
    <div class="muted">รับกลับวันนี้ (รวมทุกร้าน)</div>
    <div class="big num" id="sumTotal">–</div>
    <div class="muted num" id="sumMeta"></div>
  </div>
  <div class="card" id="sumSku"></div>
</section>

<nav>
  <button id="nShops" class="on" onclick="show('shops')">🏪 ร้าน</button>
  <button id="nSum" onclick="show('sum')">📊 สรุป</button>
</nav>
</div>

<script>
// ===== ใช้ config เดียวกับ checker เพื่อ login ร่วม =====
const API_BASE = 'https://kitchen_checker.mobile1234.site';
const API = API_BASE || location.origin;
const TOKEN_KEY = 'ks_token';                 // ← คีย์เดียวกับ checker (login ร่วม)
const WR = '/api/waste-return';
let allShops = [], cur = null, curItems = [], curUser = {};
let recvShopName = '', photoData = null, photoCoord = null;

const getTok = ()=>{ try{return localStorage.getItem(TOKEN_KEY)}catch{return null} };
const setTok = t=>{ try{ t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY) }catch{} };
const authH  = ()=>{ const t=getTok(); return t?{'Authorization':'Bearer '+t}:{} };

async function api(path, opts={}){
  const r = await fetch(API+path, {...opts,
    headers:{'Content-Type':'application/json', ...authH(), ...(opts.headers||{})}});
  if(r.status===401){ setTok(null); showLogin(); throw new Error('ต้อง login'); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail||('HTTP '+r.status));
  return j;
}

// ---------- auth ----------
async function doLogin(){
  lgErr.textContent = "";
  try{
    const d = await api('/api/login', {method:'POST',
      body:JSON.stringify({username:lgUser.value.trim(), password:lgPass.value})});
    setTok(d.token); curUser = d.user||{}; showApp();
  }catch(e){ lgErr.textContent = e.message; }
}
function logout(){ setTok(null); showLogin(); }
function showLogin(){ app.classList.add('hide'); login.classList.remove('hide'); }
function showApp(){
  login.classList.add('hide'); app.classList.remove('hide');
  userLabel.textContent = [curUser.full_name||curUser.username, curUser.kitchen_name]
                          .filter(Boolean).join(' · ');
  show('shops');
}

// ---------- navigation ----------
function show(pg){
  pgShops.classList.toggle('hide', pg!=='shops');
  pgRecv .classList.toggle('hide', pg!=='recv');
  pgSum  .classList.toggle('hide', pg!=='sum');
  nShops.classList.toggle('on', pg==='shops');
  nSum  .classList.toggle('on', pg==='sum');
  if(pg==='shops') loadShops();
  if(pg==='sum')   loadSummary();
}

// ---------- shops ----------
async function loadShops(){
  try{ allShops = await api(WR+'/shops'); renderShops(); }
  catch(e){ shopList.innerHTML = err(e); }
}
function renderShops(){
  const kw = (q.value||"").trim().toLowerCase();
  const list = allShops.filter(s =>
    s.shop_code.toLowerCase().includes(kw) || (s.shop_name||"").toLowerCase().includes(kw));
  shopList.innerHTML = list.length ? list.map(s => `
    <div class="card shop ${s.within_radius?'near':''}" onclick="openShop('${s.shop_code}')">
      <div class="row">
        <div><b>${s.shop_name||s.shop_code}</b> <span class="muted num">${s.shop_code}</span>
          ${s.distance_m!=null?`<span class="muted num"> · ${s.distance_m} ม.</span>`:''}</div>
        <span class="badge num">${s.pending_qty} ชิ้น</span>
      </div>
      <div class="muted num">${s.line_count} รายการ · waste ${s.waste_date??''}</div>
    </div>`).join('') : `<div class="muted">ไม่มีร้านค้างรับ</div>`;
}
function useLocation(){
  if(!navigator.geolocation){ alert("อุปกรณ์ไม่รองรับ location"); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat, longitude:lng} = pos.coords;
    try{
      allShops = await api(`${WR}/nearby?lat=${lat}&lng=${lng}`);
      if(!allShops.length){ alert("ยังไม่มีร้านที่บันทึกพิกัด — เลือกร้านเองไปก่อน"); loadShops(); return; }
      renderShops();
    }catch(e){ shopList.innerHTML = err(e); }
  }, e=>{
    const msg = {1:"ไม่ได้อนุญาตให้เข้าถึงตำแหน่ง — เปิดสิทธิ์ใน ตั้งค่า iOS/Safari",
                 2:"หาตำแหน่งไม่ได้ — ลองใกล้หน้าต่าง หรือเปิด WiFi",
                 3:"หาตำแหน่งช้าเกินไป — ลองกดใหม่อีกครั้ง"}[e.code] || e.message;
    alert("location (code "+e.code+"): "+msg+"\nเลือกร้านเองได้ตามปกติ");
  }, {enableHighAccuracy:false, timeout:15000, maximumAge:60000});
}

// ---------- receive ----------
async function openShop(code){
  cur = code;
  const s = allShops.find(x=>x.shop_code===code); recvShopName = (s&&s.shop_name)||'';
  recvShop.textContent = (recvShopName?recvShopName+' · ':'')+code;
  photoData=null; photoCoord=null; photoWrap.classList.add('hide'); photoInput.value='';
  recvItems.innerHTML = "กำลังโหลด…"; show('recv');
  try{
    curItems = await api(`${WR}/pending?shop_code=${encodeURIComponent(code)}`);
    const tot = curItems.reduce((a,i)=>a+Number(i.expected_qty),0);
    recvPend.textContent = tot+" ชิ้น";
    recvItems.innerHTML = curItems.map((i,idx)=>`
      <div class="item"><div class="row">
        <div><b>${i.item_code}</b><div class="muted num">waste ${i.waste_date} · คาด ${i.expected_qty}</div></div>
        <input type="number" id="q${idx}" value="${Number(i.expected_qty)}" min="0">
      </div></div>`).join('') || `<div class="muted">ไม่มีของค้างรับ</div>`;
  }catch(e){ recvItems.innerHTML = err(e); }
}
// ---------- photo: ถ่าย → ดึงพิกัด → ย่อ 1280 + ปั๊กเวลา/พิกัด → preview ----------
function loadImg(file){ return new Promise((res,rej)=>{
  const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
function getCoordOnce(){ return new Promise(res=>{
  if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>res(p.coords), ()=>res(null),
    {enableHighAccuracy:true, timeout:8000}); }); }

async function onPhoto(ev){
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  photoWrap.classList.remove('hide'); photoMeta.textContent = 'กำลังอ่านตำแหน่ง…';
  photoCoord = await getCoordOnce();
  const img = await loadImg(file);
  const maxW = 1280; let w = img.naturalWidth, h = img.naturalHeight;
  if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const lines = [
    new Date().toLocaleString('th-TH'),
    'สาขา '+cur+(recvShopName?(' · '+recvShopName):''),
    photoCoord ? ('GPS '+photoCoord.latitude.toFixed(6)+', '+photoCoord.longitude.toFixed(6))
               : 'GPS: ไม่มีสัญญาณ'
  ];
  const fs = Math.max(15, Math.round(w*0.028)), pad = Math.round(fs*0.5);
  const barH = lines.length*(fs+pad)+pad;
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, h-barH, w, barH);
  x.fillStyle = '#fff'; x.font = 'bold '+fs+'px system-ui,sans-serif'; x.textBaseline = 'top';
  lines.forEach((t,i)=>x.fillText(t, pad, h-barH+pad+i*(fs+pad)));
  photoData = c.toDataURL('image/jpeg', 0.7);
  photoPreview.src = photoData;
  const kb = Math.round(photoData.length*0.75/1024);
  photoMeta.textContent = 'พร้อมส่ง · ~'+kb+' KB'+(photoCoord?'':' · ไม่มีพิกัด');
}
photoInput.onchange = onPhoto;

function submitReceive(){
  if(!curItems.length){ alert("ไม่มีรายการ"); return; }
  if(!photoData){ alert("ถ่ายรูปโดนัทก่อนกดรับของ"); return; }
  const items = curItems.map((i,idx)=>({
    item_code:i.item_code, waste_date:i.waste_date, expected_qty:Number(i.expected_qty),
    recv_qty:Number(document.getElementById('q'+idx).value||0)}));
  const body = {shop_code:cur, driver:(curUser.full_name||curUser.username||null),
                photo_b64:photoData, items};
  if(photoCoord){ body.lat = photoCoord.latitude; body.lng = photoCoord.longitude; }
  post(body);
}
async function post(body){
  try{
    const j = await api(WR+'/receive', {method:'POST', body:JSON.stringify(body)});
    alert(`รับแล้ว ${j.total_recv} ชิ้น`);
    photoData=null; photoCoord=null; photoWrap.classList.add('hide'); photoInput.value='';
    show('shops');
  }catch(e){ alert("บันทึกไม่สำเร็จ: "+e.message); }
}

// ---------- summary ----------
async function loadSummary(){
  try{
    const s = await api(WR+'/summary');
    sumTotal.textContent = s.total_recv+" ชิ้น";
    sumMeta.textContent  = `${s.date} · ${s.return_count} ใบ`;
    sumSku.innerHTML = (s.by_sku||[]).map(x=>`
      <div class="item row"><b>${x.item_code}</b><span class="num">${x.recv_qty}</span></div>`
    ).join('') || `<div class="muted">ยังไม่มีการรับกลับวันนี้</div>`;
  }catch(e){ sumSku.innerHTML = err(e); }
}

const err = e => `<div class="muted">โหลดไม่ได้: ${e.message||e}</div>`;

// ---------- boot: มี token อยู่แล้ว (จาก checker) → เข้าเลย ----------
(async function(){
  if(getTok()){
    try{ const m = await api('/api/me');
      curUser = {username:m.username, full_name:m.full_name, role:m.role,
                 kitchen:m.kitchen, kitchen_name:m.kitchen_name};
      showApp(); return;
    }catch{}
  }
  showLogin();
})();
</script>
</body>
</html>
